name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Run portable translator test tiers
        run: python3 tools/relico_test.py --keep-going --junit
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relico-test-results
          path: .test-results/
